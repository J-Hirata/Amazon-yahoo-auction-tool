<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>在庫切れ防止確認</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <h1>在庫切れ防止確認</h1>
          <p>ヤフオクで平売りしているASINについて、Amazon上の自社出品を確認します。</p>
        </div>
        <div class="toolbar-actions">
          <a class="button-link" href="/">ASIN下書きキュー</a>
          <button id="checkNow">今すぐ確認</button>
          <button id="refresh">更新</button>
        </div>
      </section>

      <section class="guide">
        <h2>監視対象を登録</h2>
        <p class="mode-note">ASINを1行に1つずつ入れてください。セラー名は通常「キャットコーポレーション合同会社」のままで大丈夫です。監視はFBA出品、つまりAmazon発送の自社出品を対象にします。</p>
        <div class="input-area">
          <textarea id="watchAsins" rows="5" placeholder="B083XRZSFK"></textarea>
          <div class="input-actions">
            <label>セラー名
              <input id="sellerName" value="キャットコーポレーション合同会社">
            </label>
            <button id="addWatch">監視に追加</button>
          </div>
        </div>
        <p class="note">ページ監視方式のため、結果は「在庫切れ確定」ではなく「要確認」として扱います。自社発送のみが残っている場合も、FBA在庫の平売り元としては要確認にします。SP-API連携後はFBA在庫数を直接見る方式に差し替えできます。</p>
      </section>

      <p class="status" id="status"></p>
      <section class="summary" id="summary"></section>

      <section>
        <h2>要対応・監視一覧</h2>
        <div id="watchList" class="list"></div>
      </section>
    </main>
    <script type="module" src="/stock-monitor.js"></script>
  </body>
</html>
