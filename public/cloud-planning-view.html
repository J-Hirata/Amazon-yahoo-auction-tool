<main class="planning-shell">
  <header class="planning-header"><div><h1><span data-plan-icon="calendar"></span>販売の監視・見直し</h1><p id="planningCount">読み込み中</p></div><div class="planning-actions"><button id="planningRefresh" type="button" class="planning-secondary" title="一覧を更新" aria-label="一覧を更新"><span data-plan-icon="refresh"></span></button><button id="planningNew" type="button"><span data-plan-icon="plus"></span>商品を追加</button></div></header>
  <p id="planningStatus" role="status" aria-live="polite"></p>
  <section id="planningPending" class="planning-pending" hidden><strong>保存結果の確認が必要です</strong><button id="planningReconcile" type="button">保存結果を確認</button><button id="planningRetry" type="button">同じ内容で再試行</button></section>
  <div class="planning-filters"><label class="planning-search"><span data-plan-icon="search"></span><input id="planningSearch" type="search" aria-label="販売計画を検索" placeholder="商品名・ASIN・SKU・メモ"></label><label><select id="planningSort" aria-label="販売計画の並び順"><option value="due">確認日が近い順</option><option value="new">登録が新しい順</option><option value="old">登録が古い順</option></select></label></div>
  <div class="planning-tabs" role="tablist" aria-label="確認状況"><button type="button" role="tab" data-plan-filter="all" aria-selected="true">すべて <span></span></button><button type="button" role="tab" data-plan-filter="due" aria-selected="false">見直し時期 <span></span></button><button type="button" role="tab" data-plan-filter="waiting" aria-selected="false">開始待ち・日付未設定 <span></span></button><button type="button" role="tab" data-plan-filter="active" aria-selected="false">様子見・広告・保留 <span></span></button><button type="button" role="tab" data-plan-filter="closed" aria-selected="false">完了 <span></span></button></div>
  <div class="planning-modes" role="group" aria-label="表示形式"><button type="button" data-plan-mode="list" aria-pressed="true">リスト</button><button type="button" data-plan-mode="tiles" aria-pressed="false">タイル</button></div>
  <div class="planning-table-wrap"><table class="planning-table"><thead><tr><th>商品</th><th>現在の取り組み</th><th>確認日</th><th>在庫・販売先の参照</th><th>次の方針・操作</th></tr></thead><tbody id="planningRows"></tbody></table></div>
  <dialog id="planningDialog" aria-labelledby="planningDialogTitle"><form id="planningForm"><header class="planning-dialog-heading"><h2 id="planningDialogTitle">商品を追加</h2><button type="button" data-plan-close class="planning-icon-button" aria-label="入力を閉じる" title="閉じる"><span data-plan-icon="x"></span></button></header><div class="planning-form-body"><fieldset id="planningFields">
    <div class="planning-wide"><select name="source" hidden aria-hidden="true" tabindex="-1"><option value="manual">ASIN・商品名から登録</option></select>
      <details id="planningSources"><summary>登録済みの商品を写真から選ぶ</summary><label>商品を探す<input id="planningSourceSearch" type="search" placeholder="商品名・ASIN"></label><div id="planningSourceCards" class="planning-source-cards"></div></details>
      <div id="planningSelectedProduct" class="planning-selected" hidden></div><button id="planningManual" class="planning-secondary" type="button" hidden>別のASINで登録</button>
    </div>
    <details id="planningIdentity" class="planning-wide" open><summary>商品情報</summary><div class="planning-identity-fields">
    <label class="planning-wide">ASIN<input name="asin" aria-label="ASIN" maxlength="10" pattern="[A-Za-z0-9]{10}" placeholder="ASINを入れると商品名・写真を取得します"></label><p id="planningCatalogStatus" class="planning-wide" role="status" aria-live="polite"></p>
    <label class="planning-wide">商品名（自動取得・変更可）<input name="title" maxlength="200" placeholder="空欄でもASINで登録できます"></label>
    <input name="imageUrl" type="hidden"><input name="availabilityNote" type="hidden">
    <label>SKU（任意）<input name="sellerSku" maxlength="200"></label>
    <label>新品・中古<select name="condition"><option value="unknown">未確認</option><option value="new">新品</option><option value="used">中古</option><option value="parts">部品・現状品</option></select></label><label>状態・セット内容（任意）<input name="setContents" maxlength="300"></label>
    </div></details>
    <label>取り組み<select name="kind"><option value="amazon">Amazonで様子を見る</option><option value="advertising">広告テスト</option><option value="review">販売方針の見直し</option></select></label><label>状態<select name="status"><option value="active">確認を続ける</option><option value="hold">保留</option><option value="closed">完了</option></select></label>
    <label data-plan-period>確認期間（日）<input name="durationDays" type="number" min="1" max="365" step="1" value="14" required></label><label data-plan-review>次回確認日<input name="reviewOn" type="date"></label>
    <label data-plan-availability>実際に販売可能になった日<input name="availableOn" type="date"></label><label data-plan-ad>実際に広告を開始した日<input name="adStartedOn" type="date"></label>
    <label class="planning-wide">販売実績メモ<textarea name="salesMemo" rows="2" maxlength="500" placeholder="確認した期間・販売個数など"></textarea></label>
    <div class="planning-wide"><span>次の方針（複数選択・未選択なら未定）</span><p class="planning-meta">方針ごとに開始日・締切日を設定すると、日次メールでお知らせします。前の結果に応じた順番も設定できます。</p><div id="planningDecisions" class="planning-decisions"></div><div id="planningActionEditors"></div><select name="decision" hidden aria-hidden="true"><option value="undecided">未定</option><option value="amazon">Amazon販売を継続</option><option value="advertising">広告を検討</option><option value="yahoo">ヤフオク併売を検討</option><option value="rakuten">楽天併売を検討</option><option value="catalog">カタログ再作成を検討</option><option value="replenish">FBA追加納品を検討</option><option value="price">価格を見直す</option><option value="return">返送・古物市場出品</option><option value="hold">保留して再確認</option></select></div>
    <label class="planning-wide">判断メモ<textarea name="note" rows="3" maxlength="1000"></textarea></label>
  </fieldset></div><p id="planningFormStatus" role="alert"></p><footer><button type="button" data-plan-close class="planning-secondary">取消</button><button type="submit" id="planningSave"><span data-plan-icon="save"></span>保存</button></footer></form></dialog>
  <dialog id="planningHistory" aria-labelledby="planningHistoryTitle"><header class="planning-dialog-heading"><h2 id="planningHistoryTitle">判断の履歴</h2><button type="button" id="planningHistoryClose" class="planning-icon-button" aria-label="履歴を閉じる" title="閉じる"><span data-plan-icon="x"></span></button></header><div id="planningHistoryRows"></div></dialog>
</main>
