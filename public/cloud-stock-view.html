<main class="stock-shell">
  <header class="stock-heading"><div><h1><span data-stock-icon="boxes"></span>コンテナ・自社在庫</h1><p id="stockSummary" class="meta"></p></div><div class="stock-toolbar"><button id="stockRefresh" class="stock-icon-button secondary" title="最新の保存内容を表示" aria-label="更新" type="button"><span data-stock-icon="refresh"></span></button><button id="stockAmazonCheck" class="secondary" type="button">Amazon自社出品を確認</button><button id="stockPhotos" class="secondary" type="button"><span data-stock-icon="image"></span>商品写真を取得</button><button id="stockExport" class="secondary" type="button"><span data-stock-icon="download"></span>CSV出力</button><button id="stockNew" type="button"><span data-stock-icon="plus"></span>商品を登録</button></div></header>
  <p id="stockStatus" role="status" aria-live="polite"></p>
  <section id="stockPending" class="stock-pending" hidden><strong>前の操作の保存結果を確認中です</strong><div class="stock-toolbar"><button id="stockResolve" type="button">保存結果を確認</button><button id="stockRetry" type="button">同じ操作を再試行</button></div><p id="stockPendingStatus" role="status"></p></section>
  <div class="stock-filters"><label class="stock-search"><span data-stock-icon="search"></span><input id="stockSearch" type="search" aria-label="商品を検索" placeholder="商品名・ASIN・メモで検索"></label><label><select id="stockLocationFilter" aria-label="保管場所"><option value="">すべての場所</option><option value="container">コンテナ</option><option value="home">自宅・会社</option></select></label><label><select id="stockPurposeFilter" aria-label="在庫の用途"><option value="">すべての用途</option><option value="possible">FBA補充用</option><option value="not_possible">自社発送用（FBA不可）</option><option value="unknown">用途未設定</option></select></label><label><select id="stockStateFilter" aria-label="状態"><option value="">すべての状態</option><option value="catalog">カタログ準備中</option><option value="unknown">数量未確認あり</option><option value="transit">移動中</option><option value="replenishment">FBA補充検討</option></select></label></div>
  <div class="stock-table-wrap"><table class="stock-table"><thead><tr><th>商品</th><th><span data-stock-icon="warehouse"></span>コンテナ</th><th><span data-stock-icon="house"></span>自宅・会社</th><th>販売先の状況</th><th>操作</th></tr></thead><tbody id="stockRows"></tbody></table></div>
  <div class="stock-records"><section class="stock-section"><details id="stockTransfers"><summary><span data-stock-icon="truck"></span>移動・納品の記録<span id="stockTransferCount" class="stock-record-count"></span></summary><div id="stockTransferRows"></div></details></section>
  <section class="stock-section"><details><summary><span data-stock-icon="history"></span>数量変更の履歴</summary><ol id="stockHistory"></ol></details></section>
  <section class="stock-section"><details><summary><span data-stock-icon="notebook"></span>以前のコンテナメモ<span class="stock-muted">実数未確認</span></summary><div id="stockReferenceRows"></div></details></section></div>

  <dialog id="stockLinkDialog" class="stock-dialog"><form id="stockLinkForm"><header><div><h2>ヤフオクと紐付け</h2><p id="stockLinkTitle" class="stock-muted"></p></div><button type="button" data-close="stockLinkDialog" aria-label="閉じる" title="閉じる"><span data-stock-icon="x"></span></button></header>
    <fieldset class="stock-link-options"><legend>登録済みの出品</legend><div id="stockLinkOptions"></div></fieldset>
    <div class="stock-link-routes"><a id="stockLinkNew"><span data-stock-icon="link"></span>出品URLを登録する<span data-stock-icon="arrow"></span></a><a id="stockLinkDraft"><span data-stock-icon="draft"></span>未出品：下書きを作る<span data-stock-icon="arrow"></span></a></div>
    <p id="stockLinkError" class="stock-error" role="status"></p><footer><button class="secondary" type="button" data-close="stockLinkDialog">取消</button><button id="stockLinkSubmit" type="submit">選んだ出品との紐付けを確認</button></footer>
  </form></dialog>
  <dialog id="stockProductDialog" class="stock-dialog"><form id="stockProductForm"><header><h2 id="stockProductTitle">商品を登録</h2><button type="button" data-close="stockProductDialog" aria-label="閉じる" title="閉じる"><span data-stock-icon="x"></span></button></header>
    <label>商品名<input name="title" maxlength="200" required placeholder="例：Dell P3222QE モニター"></label>
    <label>新品・中古<select name="condition" required><option value="used">中古</option><option value="new">新品</option><option value="parts">部品・現状品</option><option value="unknown">未確認</option></select></label>
    <label>在庫の用途<select name="fbaEligibility"><option value="unknown">未設定</option><option value="possible">FBAへ追加納品する在庫</option><option value="not_possible">自社発送用（FBA納品不可）</option></select></label>
    <input type="hidden" name="unit" value="個">
    <fieldset id="stockInitialFields" class="stock-place-fields"><legend>場所ごとの数量</legend><div class="stock-form-grid"><label><span><span data-stock-icon="warehouse"></span>コンテナ</span><div class="stock-number-field"><input name="containerQuantity" type="number" min="0" max="1000000" step="1" placeholder="未確認"><span>個</span></div></label><label><span><span data-stock-icon="house"></span>自宅・会社</span><div class="stock-number-field"><input name="homeQuantity" type="number" min="0" max="1000000" step="1" placeholder="未確認"><span>個</span></div></label></div></fieldset>
    <label>状態・付属品・セット内容 <span class="stock-optional">任意</span><input name="setContents" maxlength="300" placeholder="例：スタンドなし、電源コード付き"></label>
    <label>ひとことメモ <span class="stock-optional">任意</span><textarea name="memo" rows="2" maxlength="500"></textarea></label>
    <details id="stockExtraFields" class="stock-extra"><summary>Amazon・ヤフオク／カタログ設定</summary>
    <label>登録済みの紐付け<select id="stockLinked"><option value="">紐付けなし</option></select></label>
    <div class="stock-form-grid"><label>ASIN（任意）<input name="asin" maxlength="10" autocomplete="off"></label><label>SKU（任意）<input name="sellerSku" maxlength="200" autocomplete="off"></label></div>
    <label>商品画像URL（任意）<input name="imageUrl" type="url" maxlength="2048" placeholder="Amazon・ヤフオクの画像URL"></label>
    <div class="stock-form-grid"><label>カタログ作業<select name="catalogTask"><option value="none">予定なし</option><option value="pending">作成待ち</option><option value="working">作業中</option><option value="registered">登録済み</option></select></label><label>再確認日<input name="reviewDate" type="date"></label></div>

    </details>
    <p id="stockProductError" class="stock-error" role="status"></p><footer><button class="secondary" type="button" data-close="stockProductDialog">取消</button><button type="submit">変更内容を確認<span data-stock-icon="arrow"></span></button></footer>
  </form></dialog>
  <dialog id="stockPlacesDialog" class="stock-dialog"><form id="stockPlacesForm"><header><div><h2>数量を編集</h2><p id="stockPlacesTitle" class="stock-muted"></p></div><button type="button" data-close="stockPlacesDialog" aria-label="閉じる" title="閉じる"><span data-stock-icon="x"></span></button></header>
    <div class="stock-form-grid stock-place-fields"><label><span><span data-stock-icon="warehouse"></span>コンテナ</span><div class="stock-number-field"><input aria-label="コンテナの使用可能数" name="container" type="number" min="0" max="1000000" step="1" placeholder="未確認"><span id="stockContainerUnit">個</span></div><small id="stockContainerBefore" class="stock-muted"></small></label><label><span><span data-stock-icon="house"></span>自宅・会社</span><div class="stock-number-field"><input aria-label="自宅・会社の使用可能数" name="home" type="number" min="0" max="1000000" step="1" placeholder="未確認"><span id="stockHomeUnit">個</span></div><small id="stockHomeBefore" class="stock-muted"></small></label></div>
    <div id="stockPlacesBuckets" class="stock-muted"></div><label>変更のメモ <span class="stock-optional">任意</span><input name="reason" maxlength="300" placeholder="例：自宅の実数を確認"></label><p id="stockPlacesError" class="stock-error" role="status"></p><footer><button class="secondary" type="button" data-close="stockPlacesDialog">取消</button><button type="submit">変更内容を確認<span data-stock-icon="arrow"></span></button></footer>
  </form></dialog>
  <dialog id="stockActionDialog" class="stock-dialog"><form id="stockActionForm"><header><div><h2>入出庫・移動</h2><p id="stockActionTitle" class="stock-muted"></p></div><button type="button" data-close="stockActionDialog" aria-label="閉じる" title="閉じる"><span data-stock-icon="x"></span></button></header>
    <div class="stock-action-modes" role="group" aria-label="入出庫の操作"><button type="button" data-stock-mode="add" aria-pressed="true"><span data-stock-icon="plus"></span>入庫</button><button type="button" data-stock-mode="remove" aria-pressed="false"><span data-stock-icon="minus"></span>販売・持ち出し</button><button type="button" data-stock-mode="dispatch" aria-pressed="false"><span data-stock-icon="truck"></span>場所を移す</button></div>
    <details id="stockAdvancedActions" class="stock-extra"><summary>その他の操作</summary><label>操作<select name="kind" id="stockActionKind"><option value="add">入庫（追加）</option><option value="remove">販売・持ち出し</option><option value="dispatch">場所を移す</option><option value="count">棚卸し・区分別に修正</option><option value="reserve">取り置きにする</option><option value="release">取り置きを戻す</option><option value="unusable">使用不可にする</option><option value="recover">使用可能へ戻す</option><option value="receive_transfer">到着・FBA受領を記録</option><option value="return_transfer">移動分を出荷元へ戻す</option></select></label></details>
    <label id="stockNormalLocation">保管場所<select name="locationId"><option value="container">コンテナ</option><option value="home">自宅・会社</option></select></label>
    <div id="stockCountFields" class="stock-form-grid" hidden><label>使用可能<input name="usable" type="number" min="0" max="1000000" step="1"></label><label>取り置き<input name="reserved" type="number" min="0" max="1000000" step="1"></label><label>使用不可<input name="unusable" type="number" min="0" max="1000000" step="1"></label></div>
    <label id="stockQtyFields"><span id="stockQtyLabel">追加する数量</span><input name="quantity" type="number" min="1" max="1000000" step="1" value="1"></label>
    <div id="stockDispatchFields" hidden><label>移動先<select name="to"><option value="home">自宅・会社</option><option value="container">コンテナ</option><option value="fba">Amazon FBA</option></select></label><label>納品ID・移動メモ<input name="reference" maxlength="200"></label></div>
    <div id="stockReceiveFields" hidden><label>対象の移動<select name="transferId"></select></label><label>到着後の区分<select name="bucket"><option value="usable">使用可能</option><option value="unusable">使用不可</option></select></label><label>到着・FBA受領の確認根拠<input name="evidence" maxlength="300" placeholder="例：納品IDの受領画面で3個を確認"></label></div>
    <label>理由<input name="reason" required maxlength="300" placeholder="例：ヤフオクで1個販売"></label><p id="stockActionError" class="stock-error" role="status"></p><footer><button class="secondary" type="button" data-close="stockActionDialog">取消</button><button type="submit">変更内容を確認<span data-stock-icon="arrow"></span></button></footer>
  </form></dialog>
  <dialog id="stockConfirmDialog" class="stock-dialog"><header><h2>変更内容の確認</h2><button type="button" data-close="stockConfirmDialog" aria-label="閉じる" title="閉じる"><span data-stock-icon="x"></span></button></header><div id="stockConfirmContent"></div><p id="stockConfirmError" class="stock-error" role="status"></p><footer><button class="secondary" type="button" data-close="stockConfirmDialog">戻る</button><button id="stockCommit" type="button"><span data-stock-icon="check"></span>この内容で保存</button></footer></dialog>
</main>
