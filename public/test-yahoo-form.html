<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>入力補助テスト</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <h1>入力補助テスト</h1>
      <section class="item">
        <label for="title">タイトル
          <input id="title" name="title">
        </label>
        <label for="category">カテゴリ
          <input id="category" name="category">
        </label>
        <div class="product-candidates">
          <div>
            <strong>TOTO シャワーホース THY478L</strong>
            <span>メーカー: TOTO / 発売日: 2012/00</span>
            <button id="candidateSelectButton" type="button">選択する</button>
          </div>
        </div>
        <label for="price">開始価格
          <input id="price" name="price">
        </label>
        <label for="productSearch">製品検索
          <input id="productSearch" name="productSearch" placeholder="商品名、メーカー、色、型番などで検索してください">
        </label>
        <button id="productSearchButton" type="button">検索する</button>
        <label for="description">商品説明
          <textarea id="description" name="description" rows="8"></textarea>
        </label>
        <label for="images">画像
          <input id="images" name="images" type="file" accept="image/*" multiple>
        </label>
        <label for="endDate">終了する日時
          <select id="endDate" name="endDate">
            <option>5月22日（金）</option>
            <option>5月23日（土）</option>
            <option>5月24日（日）</option>
            <option>5月25日（月）</option>
          </select>
        </label>
        <label for="autoRelist">自動再出品を設定する
          <select id="autoRelist" name="autoRelist">
            <option>0回</option>
            <option>1回</option>
            <option>2回</option>
            <option>3回</option>
          </select>
        </label>
        <label for="autoDiscount">自動で値下げする
          <select id="autoDiscount" name="autoDiscount">
            <option>自動で値下げしない</option>
            <option>5%</option>
            <option>10%</option>
            <option>15%</option>
          </select>
        </label>
        <button id="draftSaveButton" type="button">下書き保存</button>
        <button id="submitButton" type="button">出品する</button>
        <p id="draftSaveStatus"></p>
      </section>
    </main>
    <script>
      document.querySelector("#draftSaveButton").addEventListener("click", () => {
        document.querySelector("#draftSaveStatus").textContent = "下書き保存ボタンが押されました";
      });
      document.querySelector("#submitButton").addEventListener("click", () => {
        document.querySelector("#draftSaveStatus").textContent = "出品するボタンが押されました";
      });
      document.querySelector("#candidateSelectButton").addEventListener("click", () => {
        document.querySelector("#category").value = "オークション > 家電、AV、カメラ > キッチン、食卓 > 炊飯器 > その他";
        document.querySelector("#draftSaveStatus").textContent = "商品候補が選択されました";
      });
      document.querySelector("#productSearchButton").addEventListener("click", () => {
        document.querySelector("#draftSaveStatus").textContent = `製品検索: ${document.querySelector("#productSearch").value}`;
      });
    </script>
    <script src="/yahoo-fill.js"></script>
  </body>
</html>
