<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>販売コックピット</title>
  <meta name="description" content="出品・在庫・売れ行きをまとめて管理する、販売の司令室。">
  <link rel="stylesheet" href="/shared-photos.css"><link rel="stylesheet" href="/product-overview.css"><link rel="stylesheet" href="/product-access.css">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/link-monitor.css"><link rel="stylesheet" href="/cloud-login.css"><link rel="stylesheet" href="/physical-stock.css"><link rel="stylesheet" href="/catalog-view.css"><link rel="stylesheet" href="/sales-planning.css"><link rel="stylesheet" href="/draft-workbench.css">
</head>
<body>
  <div id="authLoading" class="auth-loading" role="status"><span class="auth-spinner" aria-hidden="true"></span>画面を準備しています</div>
  <main id="loginPanel" class="login-shell" hidden>
    <header class="login-heading"><img src="/cockpit-mark.svg" width="44" height="44" alt=""><div><span class="cockpit-eyebrow">SALES COCKPIT</span><h1>販売コックピット</h1></div></header>
    <p class="login-summary">出品・在庫・売れ行きをまとめて管理する、販売の司令室。</p>
    <p class="login-description">Amazonとヤフオクの併売、出品下書きの作成、FBA・自社・コンテナの在庫確認をひとつにまとめた販売管理ツールです。商品の売れ行きや在庫数を把握し、販売方法の見直しや広告の検討を支援します。</p>
    <form id="loginForm">
      <h2 id="loginTitle">ログイン</h2>
      <label>メールアドレス<input id="loginEmail" name="email" type="email" autocomplete="username" required></label>
      <label>パスワード<input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label>
      <button id="loginSubmit" type="submit" disabled>ログイン</button>
      <button id="setupSignIn" type="button" hidden>登録済みのアカウントでログイン</button>
    </form>
    <button id="finishSetup" type="button" hidden>このアカウントで開始</button>
    <p id="loginStatus" role="status" aria-live="polite">認証を確認しています。</p>
  </main>
  <div id="cloudApp" hidden></div>
  <script type="module" src="/cloud-login.js"></script>
</body>
</html>
