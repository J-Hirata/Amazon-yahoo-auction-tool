<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yahoo入力補助</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell helper-page">
      <section class="toolbar">
        <div>
          <h1>Yahoo入力補助</h1>
          <p>Yahoo!オークションの出品フォーム上で、下書き候補の内容を入力補助します。</p>
        </div>
        <a class="button-link" href="/">管理画面へ戻る</a>
      </section>

      <section class="helper-steps">
        <h2>使い方</h2>
        <p>下のボタンをブックマークバーへドラッグします。</p>
        <p><a class="bookmarklet" id="bookmarklet" href="#">Yahoo入力補助を起動</a></p>
        <textarea id="bookmarkletText" rows="3" readonly></textarea>
        <button id="copyBookmarklet">ブックマーク用コードをコピー</button>
        <p>Yahoo!オークションの出品フォームを開き、保存したブックマークを押すと、ページ右下に入力補助パネルが出ます。</p>
        <p>タイトル・価格・説明はフォームへ入力できます。画像URLはコピー用です。出品確定や下書き保存ボタンは押しません。</p>
      </section>
    </main>
    <script>
      const code = `javascript:(()=>{const s=document.createElement('script');s.src='http://localhost:41731/yahoo-fill.js?'+Date.now();document.body.appendChild(s);})();`;
      document.querySelector("#bookmarklet").href = code;
      document.querySelector("#bookmarkletText").value = code;
      document.querySelector("#copyBookmarklet").addEventListener("click", async () => {
        await navigator.clipboard.writeText(code);
      });
    </script>
  </body>
</html>
