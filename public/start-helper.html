<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASINツール起動ブックマーク</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell helper-page">
      <section class="toolbar">
        <div>
          <h1>ASINツール起動ブックマーク</h1>
          <p>ブックマークからツール本体を起動するための補助ページです。</p>
        </div>
        <a class="button-link" href="/">管理画面へ戻る</a>
      </section>

      <section class="helper-steps">
        <h2>使い方</h2>
        <p>このページの「ASINツール起動」をブックマークバーへ登録してください。</p>
        <p>次回からは、そのブックマークを押すだけでツール本体を起動します。ツール側が管理画面を開きます。</p>
        <p><a class="bookmarklet" href="asin-yahoo-tool://start">ASINツール起動</a></p>
        <textarea rows="2" readonly>asin-yahoo-tool://start</textarea>
        <p>ブラウザから「外部アプリを開きますか？」の確認が出た場合は、開く操作を許可してください。</p>
        <p>この登録はこのPCで一度だけ必要です。すでに登録済みなので、今後はブックマークから起動できます。</p>
      </section>
    </main>
  </body>
</html>
